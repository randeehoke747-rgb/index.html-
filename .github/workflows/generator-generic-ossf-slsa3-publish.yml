The error 'jobs' is already defined means you have two separate jobs: keys in your file. A YAML file can only contain a single root-level jobs: key.
Below is the complete, fully unified code for your .github/workflows/generator-generic-ossf-slsa3-publish.yml file.
Complete Replacement Code
Select everything currently inside your file and replace it entirely with this:
yaml
name: SLSA Generic Generator Publish

on:
  workflow_dispatch:

jobs:
  # 1. The Build Job
  build:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create artifact
        run: |
          echo "Hello SLSA" > artifact.txt

      - name: Generate hashes
        id: hash
        run: |
          echo "hashes=$(sha256sum artifact.txt | base64 -w0)" >> "$GITHUB_OUTPUT"

  # 2. The Provenance Job (Merged under the same 'jobs' key)
  provenance:
    needs: [build]
    permissions:
      id-token: write   # Required for SLSA authentication
      contents: write   # Required to attach provenance to assets
      actions: read     # Required to verify parent job status
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true
Use code with caution.
Why this fixes the problem
Single jobs: Wrapper: Both the build: task and the provenance: task are now grouped under one single jobs: header. This removes the duplicate parsing error completely.
Output Mapping: The build job explicitly passes the SHA-256 string to outputs.hashes, which the provenance job reads to prevent the downstream exit code 27 crash.
