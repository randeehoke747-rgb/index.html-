The Final outcome step threw exit code 27 because the internal script evaluated a failure status and intentionally halted execution.
The visual logs reveal that your generator step actually passed (green checkmark), but the upload-assets step was skipped completely. When upload-assets skips unexpectedly, the orchestrator sets SUCCESS=false and triggers exit code 27 to prevent invalid deployments.
Why this happens
This occurs because you are running a generic workflow execution context (workflow_dispatch), but you have upload-assets: true enabled in the script config. The SLSA builder's upload-assets step is designed to run only during a formal GitHub Release event or an active tag creation event. If it detects a manual dispatch run without an active Release attachment, it skips itself, causing the validation check to fail.
The Fixed Code
To test and run this manually via manual dispatch, change upload-assets to false. Use this exact block to replace your configuration file:
yaml
name: SLSA Generic Generator Publish

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create artifact
        run: |
          echo "Hello SLSA" > artifact.txt

      - name: Generate hashes
        id: hash
        run: |
          echo "hashes=$(sha256sum artifact.txt | base64 -w0)" >> "$GITHUB_OUTPUT"

  provenance:
    needs: [build]
    permissions:
      id-token: write   # Required for SLSA authentication
      contents: write   # Required to attach provenance files
      actions: read     # Required to verify parent job status
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: false   # Changed to false to allow workflow_dispatch runs to pass
