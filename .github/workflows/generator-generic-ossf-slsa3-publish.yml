name: SLSA Generic Generator Publish

on:
  workflow_dispatch:

jobs:
  # 1. The Build Job
  build:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create artifact
        run: |
          echo "Hello SLSA" > artifact.txt

      - name: Generate hashes
        id: hash
        run: |
          echo "hashes=$(sha256sum artifact.txt | base64 -w0)" >> "$GITHUB_OUTPUT"

  # 2. The Provenance Job (Merged under the same 'jobs' key)
  provenance:
    needs: [build]
    permissions:
      id-token: write   # Required for SLSA authentication
      contents: write   # Required to attach provenance to assets
      actions: read     # Required to verify parent job status
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true

