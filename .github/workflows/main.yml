name = "titan-browser-launcher"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
warp = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1use std::process::{Child, Command};
use std::sync::{Arc, Mutex};
use warp::Filter;

type Shared = Arc<Mutex<Vec<Child>>>;

#[tokio::main]
async fn main() {
    let state: Shared = Arc::new(Mutex::new(vec![]));
    let start_state = state.clone() 
        .and(warp::post())
        .map(move || {
            let mut procs = start_state.lock().unwrap();

            for i in 1..=3 {
                let child = Command::new("cargo")
                    .args(["run", "--bin", "titan-node"])
                    .spawn()
                    .unwrap();

                procs.push(child);
            }

            "Titan devnet started"
        });

    let stop_state = state.clone();
    let stop = warp::path!("api" / "stop")
        .and(warp::post())
        .map(move || {
            let mut procs = stop_state.lock().unwrap();

            for p in procs.iter_mut() {
                let _ = p.kill();
            }

            procs.clear();

            "Titan devnet stopped"
        });

    let web = warp::fs::dir("web");

    let routes = start.or(stop).or(web);

    println!("Open browser: http://localhost:8080");

    warp::serve(routes).run(([0,0,0,0], 8080)).await;
