name: Copilot Agent Environment Setup
on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Firewall Access
        run: |
          sudo ufw allow 8080

      - name: Run Activation Hook Script
        run: |
          chmod +x ./src/activate_all.sh
          ./src/activate_all.sh
