use axum::{Router, routing::get};
use std::fs;

#[tokio::main]
async fn main() {
    let app = Router::new()
        .route("/", get(|| async { 
            fs::read_to_string("/web/index.html").unwrap_or_else(|_| "UI missing".into()) 
        }))
        .route("/health", get(|| async { "OK" }))
        .route("/state", get(|| async { "RUNNING" }));

    // FIXED NETWORK BIND
    let listener = tokio::net::TcpListener::bind("0.0.0.0:8080").await.unwrap();
    println!("Titan Gateway running on 0.0.0.0:8080");
    
    axum::serve(listener, app).await.unwrap();
}
version: "3.8"

services:
  gateway:
    image: rust:latest
    container_name: titan-gateway
    working_dir: /app
    volumes:
      - ./gateway:/app
      - ./web:/web
    command: bash -c "cargo run"
    ports:
      - "8080:8080"
    restart: unless-stopped
