name = "gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }gateway/src/main.rs
use axum::{Router, routing::get};
use std::fs;

#[tokio::main]
async fn main() {

    let app = Router::new()
        .route("/", get(|| async {
            fs::read_to_string("/web/index.html")
                .unwrap_or("UI missing".into())
        }))
        .route("/health", get(|| async { "OK" }));

    // IMPORTANT FIX
    let listener =
        tokio::net::TcpListener::bind("0.0.0.0:8080")
            .await
            .unwrap();

    println!("Gateway online at 0.0.0.0:8080");

    axum::serve(listener, app)
        .await
        .unwrap();
