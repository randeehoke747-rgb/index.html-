services:

  gateway:
    image: rust:latest
    container_name: titan-gateway
    working_dir: /app
    volumes:
      - ./gateway:/app
      - ./web:/web
    command: bash -c "cargo run"
    ports:
      - "8080:8080"
    restart: unless-stopped

  control-plane:
    image: rust:latest
    container_name: titan-control-plane
    working_dir: /app
    volumes:
      - ./control-plane:/app
    command: bash -c "cargo run"
    restart: unless-stopped

  iron-giant:
    image: rust:latest
    container_name: iron-giant
    working_dir: /app
    volumes:
      - ./iron-giant:/app
    command: bash -c "cargo run"
    restart: unless-stopped

  worker:
    image: rust:latest
    container_name: titan-worker
    working_dir: /app
    volumes:
      - ./workers:/app
    command: bash -c "cargo run"
    restart: unless-stoppedmkdir gateway
