[workspace]
resolver = "2"
members = [
    ".",
    "crates/titan-core"
]

[package]
name = "titan-system"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "titan-control-plane"
path = "src/main.rs"

[dependencies]
titan-core = { path = "crates/titan-core" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
