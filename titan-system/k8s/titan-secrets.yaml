apiVersion: v1
kind: Secret
metadata:
  name: titan-secrets
  namespace: titan-agents
  # NOTE: This is a template containing placeholders. Do NOT check real secrets into the repository.
type: Opaque
stringData:
  # Replace the value below with the full DATABASE_URL (including password) in the form:
  # postgres://postgres:<PASSWORD>@titan-ledger-db:5432/titan
  database-url: "postgres://postgres:REPLACE_WITH_PASSWORD@titan-ledger-db:5432/titan"
  # Replace with the EVM private key value used by the runtime
  evm-private-key: "REPLACE_WITH_EVM_PRIVATE_KEY"
