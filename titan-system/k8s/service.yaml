apiVersion: v1
kind: Service
metadata:
  name: titan-agent-bridge-svc
  namespace: titan-agents
  labels:
    app: titan-agent
spec:
  type: LoadBalancer
  ports:
  - name: grpc
    port: 50051
    targetPort: grpc-bridge
    protocol: TCP
  - name: metrics
    port: 8080
    targetPort: mesh-metrics
    protocol: TCP
  selector:
    app: titan-agent
